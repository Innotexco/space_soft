<!DOCTYPE html>
{% load static tailwind_tags %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/spacesoft.css' %}">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="{% static 'css/icons/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/swiper-bundle.min.css' %}">

    <!-- AOS CSS Scroll animation -->  
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <script src="{% static 'js/aos.js' %}"></script>

    <title>{% block title %} Success {% endblock %}</title>
    <script src="{% static 'js/sweetalert2.all.min.js' %}"></script>
    <script src="{% static 'js/flowbite.js' %}"></script>
</head>
<body class="bg-slate-100">
    <script>
        if (window.history.replaceState) {
          window.history.replaceState(null, null, window.location.href);
        }

        window.addEventListener('load', function () {
            AOS.init({
                duration: 800,
                easing: 'ease-in-out',
                once: false,
                mirror: false,
                disable: 'mobile'
            });
        });
    </script>
 
    <header class=" fixed z-50 left-0 right-0 top-0 shadow-lg">
        <!-- FIRST NAV BAR -->
        <nav class=" bg-slate-100 px-3  py-2 flex justify-between items-center text-center">
            <div class="flex justify-center items-center" data-aos="fade-right" data-aos-duration="800">
                <a href="{% url 'home' %}">
                    <img src="{% static 'img/logo1.png' %}" class="w-[100px] max-w-full h-auto md:w-[150px] sm:w-[120px]" alt="Responsive Logo">
                </a>
            </div>        

            <div data-aos="fade-left" data-aos-duration="800" data-aos-delay="200" class="">
                <ul class=" group justify-center items-center text-center flex gap-10">
                    <li class=" flex gap-2 items-center hover:text-green-700">
                        <a 
                        href="https://wa.me/2349024433383" 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        class=" flex gap-2 items-center hover:text-green-700"
                        >
                            <span class=" ">
                                <i class="bi bi-whatsapp text-black hover:text-green-700 text-2xl"></i>
                            </span>
                            <article class=" hidden md:block lg:block">
                                <h4>+(234) 9024433383</h4>
                            </article>
                        </a>
                    </li>
                    
                    <li>
                        <a 
                        href="mailto:info@spacesoftintegrals.com" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        class="flex gap-2 items-center hover:text-green-700">
                            <span class=" ">
                                <i class="bi bi-envelope-at text-black hover:text-green-700 text-2xl"></i>
                            </span>
                            <article  class=" hidden md:block lg:block">
                                <h4>info@spacesoftintegrals.com</h4>
                            </article>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>    
    

    </header>



    
    {% if messages %}
        {% for message in messages %}
            <script>
                var tag = "{{message.tags}}"
                Swal.fire({
                    icon: tag,
                    title: "{{message|capfirst}}",
                    timer: 5000,
                    timerProgressBar: true,
                    showConfirmButton: false,
                    showCloseButton: true,
                    didOpen: (toast) => {
                        toast.onmouseenter = Swal.stopTimer;
                        toast.onmouseleave = Swal.resumeTimer;
                    }
                })
                
            </script>
        {% endfor %}
    {% endif %}

    <section class="bg-gray-100 pt-[9em] py-12 px-4 flex justify-center" data-aos="fade-up">
        
        <div class="max-w-xl mx-auto mt-16 bg-white p-8 rounded shadow">
            <h2 class="text-3xl font-bold text-green-700 mb-4 text-center">Enrollment Successful</h2>
            <p class="text-gray-700 text-center mb-6">Thank you for enrolling. We’ve received your information </p>
            
            <div class="text-center">
              <a href="{% url 'home' %}" class="inline-block px-6 py-3 bg-green-600 text-white rounded hover:bg-green-700 transition">
                Go to Homepage
              </a>
            </div>
        </div>
    </section>

    
   
    <script src="{% static 'js/swiper-bundle.min.js' %}"></script>
    <script src="{% static 'js/tailwind.js'%}"></script>
    <script src="{% static 'js/spacesoft.js' %}"></script>
    
</body>
</html>
