{% extends "base.html" %}
{% load static tailwind_tags %}

{% block title %}Spacesoft | Contact{% endblock %}

{% block content %} 


<!-- contact us -->
<section class="bg-gray-100 pt-[9em] py-12 px-4 flex justify-center" data-aos="fade-up">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg" data-aos="zoom-in" data-aos-delay="100">
        
       <div id="contact-form" class="hidden">
           <h2 class="text-3xl font-extrabold text-center text-gray-800 mb-8" data-aos="fade-down" data-aos-delay="200">
               Contact Us 
           </h2>
           
           <form action="{% url 'contact' %}" method="POST" class="space-y-6" >
               {% csrf_token %}
               
               <!-- Name Field -->
               <div data-aos="fade-right" data-aos-delay="300">
                   <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                   <input type="text" id="name" name="name" placeholder="Your name"
                   class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" required>
               </div>
   
               <!-- Email Field -->
               <div data-aos="fade-left" data-aos-delay="400">
                   <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                   <input type="email" id="email" name="email" placeholder="you@example.com"
                          class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" required>
               </div>
   
               <!-- Phone Number Field -->
               <div data-aos="fade-left" data-aos-delay="400">
                   <label for="contact" class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                   <input type="contact" id="contact" name="contact" placeholder="Your Contact"
                          class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" required>
               </div>
   
               <!-- Address Field -->
               <div data-aos="fade-left" data-aos-delay="400">
                   <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                   <input type="address" id="address" name="address" placeholder="Your Address"
                          class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" required>
               </div>
   
               <!-- Message Field -->
               <div data-aos="fade-up" data-aos-delay="500">
                   <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                   <textarea id="message" name="message" rows="5" placeholder="Write your message here..."
                             class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm resize-none" required></textarea>
               </div>
   
               <!-- Submit Button -->
               <div data-aos="zoom-in" data-aos-delay="700">
                   <button type="submit"
                           class="w-full bg-[#5cd837] hover:bg-[#57af3c] text-white font-semibold py-2 px-4 rounded-md shadow-md transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                       Submit
                   </button>
               </div>
           </form>
       </div>

        <div id="course-form" class="hidden">
            <h2 class="text-3xl font-extrabold text-center text-gray-800 mb-8" data-aos="fade-down" data-aos-delay="200">
                Enroll Here
            </h2>
            <form action="{% url 'course' %}" method="POST" class="space-y-6"  >
                {% csrf_token %}
        
                <!-- Name Field -->
                <div data-aos="fade-right" data-aos-delay="300">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name"
                           class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" required>
                </div>
        
                <!-- Email Field -->
                <div data-aos="fade-left" data-aos-delay="400">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com"
                           class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:border-green-500 text-sm" required>
                </div>

                
               <!-- Phone Number Field -->
               <div data-aos="fade-left" data-aos-delay="400">
                    <label for="contact" class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                    <input type="contact" id="contact" name="contact" placeholder="Your Contact"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" required>
                </div>

                <!-- Address Field -->
                <div data-aos="fade-left" data-aos-delay="400">
                    <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                    <input type="address" id="address" name="address" placeholder="Your Address"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" required>
                </div>
        
                <!-- course Field -->
                <div data-aos="fade-left" data-aos-delay="400">
                    <label for="course" class="block text-sm font-medium text-gray-700 mb-1">Training Course</label>
                    <select name="course"  class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm bg-transparent">
                        <option value="web" {% if course == "web" %}selected{% endif %}>Web Development</option>
                        <option value="design" {% if course == "design" %}selected{% endif %}>UI/UX Design</option>
                        <option value="android_dev" {% if course == "android" %}selected{% endif %}>Android Development</option>
                        <option value="IOS_dev" {% if course == "IOS" %}selected{% endif %}>IOS Development</option>
                        <option value="solar" {% if course == "solar" %}selected{% endif %}>Solar Installations</option>
                        <option value="electronics" {% if course == "elect" %}selected{% endif %}>Electronics</option>
                    </select>
                </div>
        
                <!-- Message Field -->
                <div data-aos="fade-up" data-aos-delay="500">
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..."
                              class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm resize-none" required></textarea>
                </div>
        
                <!-- Submit Button -->
                <div data-aos="zoom-in" data-aos-delay="700">
                    <button type="submit"
                            class="w-full bg-[#5cd837] hover:bg-[#57af3c] text-white font-semibold py-2 px-4 rounded-md shadow-md transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
    function showForm(formId) {
        // document.getElementById('contact-form').style.display = 'none';
        // document.getElementById('contact-form').classList.add = 'hidden';
        // document.getElementById('course-form').classList.add = 'hidden';
        // document.getElementById('course-form').style.display = 'none';
        // document.getElementById(formId).style.display = 'block';
        document.getElementById(formId).classList.toggle('hidden');
    }

    // Show based on URL query param
    window.onload = function() {
        AOS.refresh()
        const formToShow = "{{ selected_form }}";
        if (formToShow === "contact") {
            showForm("contact-form");
        } else if (formToShow === "course") {
            showForm("course-form");
        }
    }
</script>

{%endblock%}
