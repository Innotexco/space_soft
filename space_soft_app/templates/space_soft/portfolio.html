{% extends "base.html" %}
{% load static tailwind_tags %}

{% block title %}Spacesoft | Portfolio{% endblock %}

{% block content %} 

 <!-- Portfolio -->
 <section class=" lg:px-20 px-5 pt-[9em] pb-10">
    <!-- Section Title -->
    <h1 class="text-3xl font-bold text-center mb-5" data-aos="fade-up">Protfolio</h1>
    <div class="grid md:grid-cols-2 gap-10 lg:grid-cols-4">
        <div data-aos="zoom-in-up" data-aos-delay="100" class="hover:shadow-neutral-400 text-center shadow-lg rounded-md shadow-neutral-300 bg-white px-4 sm:py-8">
            <img src="{% static 'img/p1.jpeg' %}" class="portfolio-img  cursor-zoom-in mx-auto rounded-md mb-4 w-full h-80" alt="">
            <p class=" font-medium text-2xl py-3 text-gray-800">News Blog</p>
        </div>

        <div data-aos="zoom-in-up" data-aos-delay="200" class="hover:shadow-neutral-400 text-center shadow-lg rounded-md shadow-neutral-300 bg-white px-4 sm:py-8">
            <img src="{% static 'img/p3.jpeg' %}" class="portfolio-img  cursor-zoom-in mx-auto rounded-md mb-4 w-full h-80" alt="">
            <p class=" font-medium text-2xl py-3  text-gray-800">E-Comerce Porta</p>
        </div>

        <div data-aos="zoom-in-up" data-aos-delay="300" class="hover:shadow-neutral-400 text-center shadow-lg rounded-md shadow-neutral-300 bg-white px-4 sm:py-8">
            <img src="{% static 'img/p2.jpeg' %}" class="portfolio-img cursor-zoom-in mx-auto rounded-md mb-4 w-full h-80" alt="">
            <p class=" font-medium text-2xl py-3 text-gray-800">Business Website</p>
        </div>

        <div data-aos="zoom-in-up" data-aos-delay="400" class="hover:shadow-neutral-400 text-center shadow-lg rounded-md shadow-neutral-300 bg-white px-4 sm:py-8">
            <img src=" {% static 'img/p4.jpeg' %}" class="portfolio-img cursor-zoom-in mx-auto rounded-md mb-4 w-full h-80" alt="">
            <p class=" font-medium text-2xl py-3 text-gray-800">Church Website</p>
        </div>
    </div>
 </section>

<!-- Enlarged Image Overlay -->
<div class="fixed inset-0 bg-black bg-opacity-70 hidden z-50 items-center justify-center p-4" id="enlargedImgContainer">
  <img 
    id="enlargedImg" 
    class="w-full max-w-3xl max-h-[90vh] object-contain rounded-lg shadow-lg cursor-zoom-out" 
    src="" 
    alt="Enlarged image"
  >
</div>  

<!-- JavaScript -->
<script>
  document.querySelectorAll('.portfolio-img').forEach(img => {
    img.addEventListener('click', () => {
      console.log("img shown");
      const enlargedImgContainer = document.getElementById('enlargedImgContainer');
      const enlargedImg = document.getElementById('enlargedImg');
      enlargedImg.src = img.src;
      enlargedImgContainer.classList.remove('hidden');
      enlargedImgContainer.classList.add('flex');
      enlargedImgContainer.style.display = ''; // clear inline style if any
    });
  });

  document.getElementById('enlargedImgContainer').addEventListener('click', () => {
    const container = document.getElementById('enlargedImgContainer');
    container.classList.add('hidden');
    container.classList.remove('flex');
    enlargedImgContainer.style.display = ''; // clear inline style if any
    console.log("img hidden");
  });
</script>


{%endblock%}
