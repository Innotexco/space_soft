{% load static %}
<section class="mt-[10px]">
    <div class="w-full relative mx-auto">
        <div id="{{ carousel_id|default:'default-carousel' }}" class="relative" data-carousel="static">
            <div class="overflow-hidden relative h-[400px] sm:h-[500px] md:h-[600px] lg:h-[700px]">

                {% if images %}
                    {% for image in images %}
                        <div class="duration-1000 ease-in-out" data-carousel-item>
                            <img src="{{ image.url }}" alt="Slide {{ forloop.counter }}"
                                class="w-full h-full object-cover block absolute top-0 left-0 mix-blend-overlay" />
                        </div>
                    {% endfor %}
                {% else %}
                    <div class="duration-1000 ease-in-out" data-carousel-item>
                        <img src="{% static 'img/my panel.jpg' %}"   alt="Slide 1"
                            class="w-full h-full object-cover block absolute top-0 left-0 mix-blend-overlay" />
                    </div>
                    <div class="duration-1000 ease-in-out" data-carousel-item>
                        <img src="{% static 'img/cctv adv.jpg' %}" alt="Slide 2"
                            class="w-full h-full object-cover block absolute top-0 left-0 mix-blend-overlay" />
                    </div>
                    <div class="duration-1000 ease-in-out" data-carousel-item>
                        <img src="{% static 'img/sol.jpg' %}" alt="Slide 3"
                            class="w-full h-full object-cover block absolute top-0 left-0 mix-blend-overlay" />
                    </div>
                {% endif %}
            </div>

            <!-- Text Overlay (optional) -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center text-white z-40 px-4 sm:px-0">
                <span class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold">
                    Welcome To SpaceSoft Integral
                </span>
                <span class="text-lg sm:text-2xl lg:text-4xl mt-4">
                    System L.T.D
                </span>
                <span class="text-sm sm:text-lg md:text-2xl lg:text-3xl mt-2">
                    Bridging the space in the industry
                </span>
            </div>

            <!-- Indicators -->
            <div class="flex absolute bottom-5 left-1/2 z-40 space-x-3 -translate-x-1/2">
                {% for _ in images %}
                    <button class="w-3 h-3 rounded-full bg-gray-300 hover:bg-gray-500"
                        data-carousel-slide-to="{{ forloop.counter0 }}"></button>
                {% endfor %}
                {% if not images %}
                    <button class="w-3 h-3 rounded-full bg-gray-300 hover:bg-gray-500" data-carousel-slide-to="0"></button>
                {% endif %}
            </div>

            <!-- Navigation -->
            <button type="button"
                class="flex absolute top-0 left-0 z-40 justify-center items-center px-2 sm:px-4 h-full cursor-pointer group focus:outline-none"
                data-carousel-prev>
                <span class="inline-flex justify-center items-center w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-[#5cd837] hover:bg-[#57af3c] group-focus:ring-4 group-focus:ring-white">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                    </svg>
                </span>
            </button>

            <button type="button"
                class="flex absolute top-0 right-0 z-40 justify-center items-center px-2 sm:px-4 h-full cursor-pointer group focus:outline-none"
                data-carousel-next>
                <span class="inline-flex justify-center items-center w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-[#5cd837] hover:bg-[#57af3c] group-focus:ring-4 group-focus:ring-white">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                    </svg>
                </span>
            </button>
        </div>
    </div>


    <script>
        let carouselInterval;
        const startAutoSlide = () => {
            carouselInterval = setInterval(() => {
                const dropdownOpen = document.querySelector('.dropdown-menu:not(.hidden)');
                if (!dropdownOpen) {
                    const nextButton = document.querySelector('[data-carousel-next]');
                    if (nextButton) nextButton.click();
                }
            }, 9000);
        };

        const stopAutoSlide = () => clearInterval(carouselInterval);

        const carousel = document.getElementById('{{ carousel_id|default:"default-carousel" }}');
        const navbar = document.getElementById('navbar');

        [carousel, navbar].forEach(el => {
            if (el) {
                el.addEventListener('mouseenter', stopAutoSlide);
                el.addEventListener('mouseleave', startAutoSlide);
            }
        });

        window.onload = startAutoSlide;
    </script>
    
</section>
